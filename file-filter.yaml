bug_agent_file_filter:
  # Always exclude these paths (high confidence noise)
  exclude_paths:
    - '**/.git/**'
    - '**/node_modules/**'
    - '**/vendor/**'
    - '**/third_party/**'
    - '**/.venv/**'
    - '**/venv/**'
    - '**/__pypackages__/**'
    - '**/site-packages/**'
    - '**/.mypy_cache/**'
    - '**/.pytest_cache/**'
    - '**/.ruff_cache/**'
    - '**/.tox/**'
    - '**/.gradle/**'
    - '**/.nuget/**'
    - '**/Pods/**'
    - '**/Carthage/**'
    - '**/.bundle/**'
    - '**/dist/**'
    - '**/build/**'
    - '**/out/**'
    - '**/target/**'
    - '**/coverage/**'
    - '**/__snapshots__/**'
    - '**/snapshots/**'

  # Always exclude these extensions
  exclude_exts:
    - '.log'
    - '.tmp'
    - '.cache'
    - '.pid'
    - '.swp'
    - '.png'
    - '.jpg'
    - '.jpeg'
    - '.gif'
    - '.pdf'
    - '.zip'
    - '.tar'
    - '.gz'
    - '.7z'
    - '.mp3'
    - '.mp4'
    - '.mov'
    - '.wasm'
    - '.so'
    - '.dylib'
    - '.dll'
    - '.exe'
    - '.xml'

  # Always exclude these specific files (locks/manifests/minified)
  exclude_files:
    - '**/*.lock'
    - '**/package-lock.json'
    - '**/pnpm-lock.yaml'
    - '**/yarn.lock'
    - '**/poetry.lock'
    - '**/Pipfile.lock'
    - '**/Cargo.lock'
    - '**/Gemfile.lock'
    - '**/composer.lock'
    - '**/*.min.js'
    - '**/*.min.css'
    - '**/*.map'
    - '**/schema.*'
    - '**/aem-dev-schema.*'
    - '**/*.gql.*'
    - '**/*.d.ts'
    - '**/types.ts'
    - '**/*types.ts'
    - '**/type.ts'

  # Sometimes important: only include when bug type matches
  conditional_include:
    config_or_ci:
      include_globs:
        - '**/*.yml'
        - '**/*.yaml'
        - '**/*.toml'
        - '**/*.ini'
        - '**/*.env'
        - '**/.env.*'
        - '**/*.properties'
        - '**/*.conf'
        - '**/Dockerfile*'
        - '**/docker-compose*.yml'
        - '**/Makefile'
        - '**/*.mk'
        - '**/Jenkinsfile'
        - '**/.github/workflows/**'
        - '**/.gitlab-ci.yml'
        - '**/build.gradle*'
        - '**/pom.xml'

  # Size gates
  size_rules:
    hard_exclude_bytes: 2097152 # 2 MB
    soft_exclude_bytes: 307200 # 300 KB
    always_include_exts_even_if_large:
      - '.py'
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.go'
      - '.java'
      - '.kt'
      - '.rs'
      - '.cpp'
      - '.c'
      - '.cs'
